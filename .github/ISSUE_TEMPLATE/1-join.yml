name: Join ルーキークエストテスト
description: このクラスのメンバーとして登録します。最初にこれをしてください！
title: "Join ルーキークエストテスト"
labels: ["join"]
body:
  - type: markdown
    attributes:
      value: |
        ようこそ！ このフォームに記入して、クラスに参加しましょう。
        このリポジトリは**公開**されています。インターネット上の誰でも読めます。
        **本名は書かないでください。**

        > **出す場所を確かめてください。** このページのアドレスが `github.com/kwaka1208/quests-test/` で始まっていなければ、ここではありません（自分の fork などです）。
        > ここで出しても、bot は返信せず、記録にも残りません。[元のリポジトリの New issue](https://github.com/kwaka1208/quests-test/issues/new/choose) から出し直してください。
  - type: input
    id: handle
    attributes:
      label: Handle
      description: このクラスで使う名前です（bot の返信と、先生の記録に使います）。英字・数字・空白・`-`・`_` で1〜20文字。本名は使わないこと！
      placeholder: Falcon
    validations:
      required: true
