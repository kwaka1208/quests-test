name: Submit a Flag
description: クエストをクリアしたら、ここでフラグを提出します。
title: "Flag submission"
labels: ["flag"]
body:
  - type: markdown
    attributes:
      value: |
        `quest.py` が表示したフラグを貼りつけてください。
        フラグは**あなたの** GitHub アカウント専用です。ほかの人のフラグを写しても正解になりません。

        > **出す場所を確かめてください。** このページのアドレスが `github.com/kwaka1208/quests-test/` で始まっていなければ、ここではありません（自分の fork などです）。
        > ここで出しても、bot は返信せず、記録にも残りません。[元のリポジトリの New issue](https://github.com/kwaka1208/quests-test/issues/new/choose) から出し直してください。
  - type: input
    id: quest
    attributes:
      label: Quest
      description: クエストのフォルダの名前です。
      placeholder: quest-00
    validations:
      required: true
  - type: input
    id: flag
    attributes:
      label: Flag
      placeholder: FLAG{xxxxxxxxxx}
    validations:
      required: true
